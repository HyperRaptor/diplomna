name: CI
on:
  push:
    branches:
      - main
      - ci/cd
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run dotnet format
        run: dotnet format --no-restore --verify-no-changes

  test:
    name: Test and check coverage
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create artifacts directory
        run: New-Item -ItemType Directory -Force -Path artifacts, CodeCoverage

      - name: Cache Unity Library
        id: unity-cache
        uses: actions/cache@v4
        with:
          path: |
            Library
            F:\UnityPackageCache
          key: Unity-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-

      - name: Clear Library if cache invalid
        if: steps.unity-cache.outputs.cache-hit != 'true'
        run: |
          if (Test-Path "Library") {
            Remove-Item -Recurse -Force "Library"
          }

      - name: Set Unity package cache location
        run: |
          $cacheDir = "F:\UnityPackageCache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          $bootConfig = "ProjectSettings\boot.config"
          if (Test-Path $bootConfig) {
            $content = Get-Content $bootConfig
            $content | Where-Object { $_ -notmatch "packagecache-path" } | Set-Content $bootConfig
          }
          Add-Content -Path $bootConfig -Value "packagecache-path=$cacheDir"

      - name: Clear Library to force debug recompile
        run: |
          if (Test-Path "Library") {
            Remove-Item -Recurse -Force "Library"
          }

      - name: Run Unity tests with coverage
        run: |
          $unityPath = "F:\Unity\Installs\6000.3.8f1\Editor\Unity.exe"
          $projectPath = (Get-Location).Path
          $logFile = Join-Path $projectPath "artifacts\unity-log.txt"
          $testResults = Join-Path $projectPath "artifacts\test-results.xml"
          $coveragePath = Join-Path $projectPath "CodeCoverage"
          $arguments = @(
            "-batchmode",
            "-nographics",
            "-projectPath", $projectPath,
            "-runTests",
            "-testMode", "EditMode",
            "-testResults", $testResults,
            "-enableCodeCoverage",
            "-coverageResultsPath", $coveragePath,
            "-coverageOptions", "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport",
            "-debugCodeOptimization",
            "-logFile", $logFile
          )
          $process = Start-Process -FilePath $unityPath -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          Write-Host "Unity exited with code: $exitCode"
          if (Test-Path $logFile) {
            Get-Content $logFile | Where-Object {
              $_ -match "error|warning|Test|Coverage|FAILED|PASSED|Exception|seqpnt|sequence"
            }
          }
          exit $exitCode

      - name: Enforce minimum 90% coverage
        run: |
          $summaryFile = "CodeCoverage\Report\Summary.xml"
          if (-not (Test-Path $summaryFile)) {
            Write-Error "Coverage summary file not found at $summaryFile"
            exit 1
          }
          [xml]$xml = Get-Content $summaryFile
          $summary = $xml.SelectSingleNode(".//Summary")
          if ($null -eq $summary) {
            Write-Error "Summary node not found in coverage report."
            exit 1
          }
          $visited = [int]$summary.GetAttribute("visitedSequencePoints")
          $total = [int]$summary.GetAttribute("numSequencePoints")
          $percent = if ($total -gt 0) { ($visited / $total) * 100.0 } else { 0.0 }
          Write-Host ("Total line coverage: {0:F2}% (minimum required: 90.00%)" -f $percent)
          if ($percent -lt 90.0) {
            Write-Error "Coverage below required threshold."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-coverage-results
          path: CodeCoverage/