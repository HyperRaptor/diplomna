name: CI
on:
  push:
    branches:
      - main
      - ci/cd
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run dotnet format
        run: dotnet format --no-restore --verify-no-changes

  test:
    name: Test and check coverage
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create artifacts directory
        run: New-Item -ItemType Directory -Force -Path artifacts, CodeCoverage

      - name: Run Unity tests with coverage
        run: |
          $unityPath = "F:\Unity\Installs\6000.3.8f1\Editor\Unity.exe"
          & $unityPath `
            -batchmode `
            -nographics `
            -projectPath . `
            -runTests `
            -testMode All `
            -testResults artifacts/test-results.xml `
            -enableCodeCoverage `
            -coverageResultsPath CodeCoverage `
            -coverageOptions "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport" `
            -logFile artifacts/unity-log.txt
          $exitCode = $LASTEXITCODE
          Write-Host "Unity exited with code: $exitCode"
          if (Test-Path artifacts/unity-log.txt) {
            Get-Content artifacts/unity-log.txt
          } else {
            Write-Host "No log file was created - Unity may have failed to start"
            Get-ChildItem artifacts/
          }
          exit $exitCode

      - name: Enforce minimum 90% coverage
        run: |
          $coveragePath = "CodeCoverage"
          $minPercent = 90.0
          $summaryFile = Join-Path $coveragePath "Summary.xml"
          if (-not (Test-Path $summaryFile)) {
            Write-Error "Coverage summary file not found at $summaryFile"
            exit 1
          }
          [xml]$xml = Get-Content $summaryFile
          $summary = $xml.SelectSingleNode(".//Summary")
          if ($null -eq $summary) {
            Write-Error "Summary node not found in coverage report."
            exit 1
          }
          $visited = [int]$summary.GetAttribute("visitedSequencePoints")
          $total = [int]$summary.GetAttribute("numSequencePoints")
          $percent = if ($total -gt 0) { ($visited / $total) * 100.0 } else { 0.0 }
          Write-Host ("Total line coverage: {0:F2}% (minimum required: {1:F2}%)" -f $percent, $minPercent)
          if ($percent -lt $minPercent) {
            Write-Error "Coverage below required threshold."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-coverage-results
          path: CodeCoverage/