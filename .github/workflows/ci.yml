name: CI
on:
  push:
    branches:
      - main
      - ci/cd
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run dotnet format
        run: dotnet format --no-restore --verify-no-changes

  test:
    name: Test and check coverage
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create artifacts directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path artifacts, CodeCoverage

      - name: Run Unity tests with coverage
        shell: pwsh
        run: |
          $unityPath = "F:\Unity\Installs\6000.3.8f1\Editor\Unity.exe"
          & $unityPath `
            -batchmode `
            -nographics `
            -projectPath . `
            -runTests `
            -testMode All `
            -testResults artifacts/test-results.xml `
            -enableCodeCoverage `
            -coverageResultsPath CodeCoverage `
            -coverageOptions "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport" `
            -logFile artifacts/unity-log.txt
          $exitCode = $LASTEXITCODE
          Get-Content artifacts/unity-log.txt
          exit $exitCode

      - name: Enforce minimum 90% coverage
        shell: pwsh
        run: |
          python - << 'PY'
          import os, sys, xml.etree.ElementTree as ET
          coverage_path = "CodeCoverage"
          min_percent = 90.0
          summary_file = os.path.join(coverage_path, "Summary.xml")
          if not os.path.isfile(summary_file):
              print(f"Coverage summary file not found at {summary_file}", file=sys.stderr); sys.exit(1)
          tree = ET.parse(summary_file)
          root = tree.getroot()
          summary = root.find(".//Summary")
          if summary is None:
              print("Summary node not found in coverage report.", file=sys.stderr); sys.exit(1)
          try:
              visited = int(summary.get("visitedSequencePoints", "0"))
              total   = int(summary.get("numSequencePoints",   "0"))
          except ValueError:
              print("Invalid sequence point values.", file=sys.stderr); sys.exit(1)
          percent = (visited / total * 100.0) if total > 0 else 0.0
          print(f"Total line coverage: {percent:.2f}% (minimum required: {min_percent:.2f}%)")
          if percent < min_percent:
              print("Coverage below required threshold.", file=sys.stderr); sys.exit(1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts/

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-coverage-results
          path: CodeCoverage/